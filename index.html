<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kids Exercise">
<meta name="theme-color" content="#7C4DFF">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<title>Kids Exercise Generator</title>
<link rel="stylesheet" href="css/styles.css?v=8">
</head>
<body>
<div class="frog-frame">
  <div class="frog-head-cap"></div>
  <div class="frog-eye frog-eye-left"><div class="frog-pupil"></div></div>
  <div class="frog-eye frog-eye-right"><div class="frog-pupil"></div></div>
  <div class="frog-nose"><span></span><span></span></div>
  <div class="frog-mouth">
    <svg viewBox="0 0 64 36" width="48" height="27" aria-hidden="true">
      <rect x="2" y="2" width="60" height="32" rx="15" fill="#37413A"/>
      <path d="M20,17 C20,12 26,11 32,15 C38,11 44,12 44,17 C44,23 34,28 32,25 C30,28 20,23 20,17 Z" fill="#F8A5C2"/>
    </svg>
  </div>
  <div class="frog-side-dots frog-side-dots-left">
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </div>
  <div class="frog-side-dots frog-side-dots-right">
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </div>
  <div class="frog-screen">
    <div id="app"></div>
    <div class="frog-leg frog-leg-tl"><span class="frog-toe"></span><span class="frog-toe"></span><span class="frog-toe"></span></div>
    <div class="frog-leg frog-leg-tr"><span class="frog-toe"></span><span class="frog-toe"></span><span class="frog-toe"></span></div>
    <div class="frog-leg frog-leg-bl"><span class="frog-toe"></span><span class="frog-toe"></span><span class="frog-toe"></span></div>
    <div class="frog-leg frog-leg-br"><span class="frog-toe"></span><span class="frog-toe"></span><span class="frog-toe"></span></div>
  </div>
</div>

<!-- Plain (non-module) scripts, loaded in dependency order, so this works when opened
     directly via file:// on an iPad with no local server (Safari blocks fetch()/ES module
     imports under file://, but not ordinary scripts). -->
<script src="js/data.js?v=11"></script>
<script src="js/helpers.js?v=10"></script>
<script src="js/storage.js?v=10"></script>
<script src="js/toons.js?v=9"></script>
<script src="js/illustrations.js?v=9"></script>
<script src="js/generators/math.js?v=12"></script>
<script src="js/generators/reading.js?v=10"></script>
<script src="js/generators/logic.js?v=9"></script>
<script src="js/lessons.js?v=9"></script>
<script src="js/curriculum.js?v=10"></script>
<script src="js/profiles.js?v=1"></script>
<script src="js/flashcards.js?v=10"></script>
<script src="js/app.js?v=12"></script>
</body>
</html>
