<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kids Exercise">
<meta name="theme-color" content="#7C4DFF">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<title>Kids Exercise Generator</title>
<link rel="stylesheet" href="css/styles.css?v=7">
</head>
<body>
<div class="frog-frame">
  <div class="frog-head-cap"></div>
  <div class="frog-eyes">
    <div class="frog-eye"><div class="frog-pupil"></div></div>
    <div class="frog-eye"><div class="frog-pupil"></div></div>
  </div>
  <div class="frog-mouth">
    <svg viewBox="0 0 120 46" width="76" height="30" aria-hidden="true">
      <path d="M6,6 Q60,44 114,6" fill="none" stroke="#12351A" stroke-width="8" stroke-linecap="round"/>
      <ellipse cx="60" cy="24" rx="9" ry="6" fill="#F8A5C2"/>
    </svg>
  </div>
  <div class="frog-side-dot frog-side-dot-left"></div>
  <div class="frog-side-dot frog-side-dot-right"></div>
  <div class="frog-screen">
    <div id="app"></div>
  </div>
  <div class="frog-hand frog-hand-left"></div>
  <div class="frog-hand frog-hand-right"></div>
</div>

<!-- Plain (non-module) scripts, loaded in dependency order, so this works when opened
     directly via file:// on an iPad with no local server (Safari blocks fetch()/ES module
     imports under file://, but not ordinary scripts). -->
<script src="js/data.js?v=11"></script>
<script src="js/helpers.js?v=10"></script>
<script src="js/storage.js?v=10"></script>
<script src="js/toons.js?v=9"></script>
<script src="js/illustrations.js?v=9"></script>
<script src="js/generators/math.js?v=12"></script>
<script src="js/generators/reading.js?v=10"></script>
<script src="js/generators/logic.js?v=9"></script>
<script src="js/lessons.js?v=9"></script>
<script src="js/curriculum.js?v=10"></script>
<script src="js/profiles.js?v=1"></script>
<script src="js/flashcards.js?v=10"></script>
<script src="js/app.js?v=12"></script>
</body>
</html>
